services:
  postgres:
    image: postgres:16-alpine
    container_name: linkforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
      POSTGRES_DB: linkforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: linkforge_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://linkforge:linkforge@postgres:5432/linkforge
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
      APP_URL: ${APP_URL:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      GUEST_LINK_LIMIT_PER_HOUR: ${GUEST_LINK_LIMIT_PER_HOUR:-10}
      USER_LINK_LIMIT_PER_HOUR: ${USER_LINK_LIMIT_PER_HOUR:-100}
      GUEST_LINK_TTL_MS: ${GUEST_LINK_TTL_MS:-604800000}
      ANALYTICS_PEPPER: ${ANALYTICS_PEPPER:-change-me-too}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LinkForge <no-reply@example.com>}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: linkforge_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: